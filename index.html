<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>antools.</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <header class="header" id="header">
        <div class="container header_container">
          <a href="#">
            <img src="./pictures/logo.png" alt="header logo">
          </a>  
          <nav class="nav" id="nav">
            <ul class="nav_list">
                <li class="nav_item">
                    <a href="#" class="nav_link">home</a>
                </li>
                <li class="nav_item">
                    <a href="#" class="nav_link">
                        categories 
                    <img src="./pictures/icon.svg" alt="icon logo"> 
                </a>
                </li>
                <li class="nav_item">
                    <a href="#" class="nav_link">my collections</a>
                </li>
                <li class="nav_item">
                    <a href="#" class="nav_link">blog</a>
                </li>
            </ul>

          </nav>
          <div class="header_btn">
            <a class="header_login" href="#">login</a>
            <a class="header_register" href="#">sign up</a>
          </div>
        </div>
     

    </header>
    <main class="main" id="main">
        <section class="hero">
            <div class="container">
                <div class="hero_container">
                    <div class="hero_text">
                        <h1>awesome tools for designer & developer<span class="dot">.</span></h1>
                        <p>
                            Antool is a web collection of information on paid or free design and development tools
                        </p>
                         <div class="home_input">
                            <div>
                                <img src="./pictures/search.svg" alt="search icon" />
                                <input type="text" placeholder="find more than 430+ tools..." />
                            </div>
                            <button>search</button>
                        </div>
                        <div class="hero_media">
                            <a href="#">
                                <img src="./pictures/facebook.svg" alt="facebook img" />
                            </a>
                            <a href="#">
                                <img src="./pictures/instagram.svg" alt="instagram img" />
                            </a>
                            <a href="#">
                                <img src="./pictures/twitter.svg" alt="twitter img" />
                            </a>
                        </div>
                    </div>
                    <img src="./pictures/main image.png" alt="image logo">
                </div>
            </div>
        </section>
    </main>
  </body>
</html>
